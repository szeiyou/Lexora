[package]
name = "codict"
version = "0.1.0"
description = "Lexora desktop client"
license = "MIT"
authors = ["CoDict"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-http = "2"
tauri-plugin-store = "2"
